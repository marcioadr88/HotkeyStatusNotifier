name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed to create a GitHub Release and upload build artifacts to it.
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish framework-dependent single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64

      - name: Create GitHub Release and upload exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'gh release create "$env:GITHUB_REF_NAME" publish/win-x64/HotkeyStatusNotifier.exe --notes "Requires the .NET 8 Desktop Runtime (x64); the .NET SDK is not needed. Install it: https://dotnet.microsoft.com/download/dotnet/8.0" --generate-notes'